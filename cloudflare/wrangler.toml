name = "cecs327-lodging"
workers_dev = true
preview_urls = true
main = "src/index.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "cecs327-lodging"
database_id = "0349fd11-02aa-4509-bcc5-ec72f06bb7a1"

# Communication milestone: pub-sub broker + group coordinator
[[durable_objects.bindings]]
name = "COMM_HUB"
class_name = "CommHub"

[[migrations]]
tag = "v1-comm-hub"
new_sqlite_classes = ["CommHub"]

[observability]
enabled = true

[assets]
binding = "ASSETS"
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Serve on PitchBlack domain (replaces Vercel coming-soon when routes are active)
[[routes]]
pattern = "pitchblack.icu/*"
zone_name = "pitchblack.icu"

[[routes]]
pattern = "www.pitchblack.icu/*"
zone_name = "pitchblack.icu"
